<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地圖編輯 · Map builder demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
<script src="https://cdn.jsdelivr.net/npm/s2-geometry@1.2.10/src/s2geometry.js"></script>
<style>
:root { --ink:#2F5D8A; --navy:#16263F; --plum:#6E2B3F; --brass:#C9A15A; --wax:#A3364F; --paper:#F6F8FB; --line:#DCE3EC; --muted:#6B7A8F; --light:#5A8FD0; --glass:#DCE8F2; --card:#fff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--navy); font: 14px/1.5 "Noto Sans TC", system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, .serif { font-family: "Noto Serif TC", serif; font-weight: 700; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header .brand { font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 16px; }
header .city { color: var(--muted); }
header .sp { flex: 1; }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; color: var(--muted); }
.seg button.on { background: var(--ink); color: #fff; }
.lang { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 10px; }
main { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; }
.maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { display: none; }

/* toolbar */
.tools { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; overflow-x: auto; z-index: 3; pointer-events: none; scrollbar-width: none; }
.tools > * { pointer-events: auto; flex: none; }
.tool { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; box-shadow: 0 2px 8px rgba(22,38,63,.08); white-space: nowrap; }
.tool.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.tool .plus { font-weight: 700; }
.hint { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 7px 14px; border-radius: 999px; z-index: 3; font-size: 13px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.hint button { background: none; border: 0; color: #fff; text-decoration: underline; margin-left: 8px; padding: 0; }
.gps { position: absolute; left: 12px; bottom: 12px; z-index: 3; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--muted); }
.toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 9px 16px; border-radius: 12px; z-index: 6; font-size: 13px; max-width: calc(100% - 32px); text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

/* panel */
.panel { position: absolute; z-index: 4; background: var(--card); overflow-y: auto; }
@media (min-width: 900px) {
  main { display: grid; grid-template-columns: 1fr 400px; }
  .mapwrap { position: relative; }
  .panel { position: relative; border-left: 1px solid var(--line); }
}
@media (max-width: 899px) {
  .mapwrap { position: absolute; inset: 0; }
  .panel { left: 0; right: 0; bottom: 0; max-height: 58dvh; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(22,38,63,.14); }
  .panel.small { max-height: 30dvh; }
  .panel .grab { display: block; }
  .gps { bottom: auto; top: 56px; }
}
@media (max-width: 520px) { header { gap: 8px; } header .city { display: none; } header .brand { font-size: 15px; } .seg button { padding: 5px 9px; } }
.panel .grab { display: none; width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; border: 0; }
.pi { padding: 14px 16px 24px; }
.pi h2 { font-size: 18px; margin: 4px 0 2px; }
.note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.sec { border-top: 1px solid var(--line); padding: 12px 0; }
.sec:first-of-type { border-top: 0; }
.sec h3 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.num { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: #fff; font: 700 12px "Noto Serif TC", serif; }
label.f { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
input[type=text], input[type=number], input[type=date] { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #fff; color: var(--navy); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.chip.on { border-color: var(--ink); background: #EAF1F8; color: var(--ink); }
.chip small { color: var(--muted); margin-left: 4px; }
.scenes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.scene { border: 2px solid transparent; border-radius: 10px; padding: 0; background: none; overflow: hidden; position: relative; aspect-ratio: 1.4; }
.scene img { width: 100%; height: 100%; object-fit: cover; display: block; }
.scene span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; background: rgba(255,255,255,.88); padding: 1px 4px; }
.scene.on { border-color: var(--ink); }
.scene.up { border: 1px dashed var(--muted); display: grid; place-items: center; color: var(--muted); font-size: 12px; background: var(--paper); }
.notes { display: grid; gap: 6px; margin-top: 8px; }
.soft { display: flex; gap: 8px; align-items: flex-start; background: #FBF6EA; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.soft i { font-style: normal; color: var(--brass); font-weight: 700; }
.soft.ok { background: #EEF4EA; }
.soft.ok i { color: #4E7D4A; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; }
.btn.pri { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.red { color: var(--wax); border-color: #E7C8D0; }
.btn:disabled { opacity: .45; cursor: default; }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.actions .btn.pri { flex: 1; }
.tabs { display: flex; gap: 6px; margin: 4px 0 10px; flex-wrap: wrap; }
.swatches { display: flex; gap: 8px; margin-top: 6px; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw.on { box-shadow: 0 0 0 2px var(--ink); }
.sw.grad { background: linear-gradient(0deg, #16263F, #2F5D8A 40%, #5A8FD0 75%, #DCE8F2); }
.models { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.model { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 2px 4px; font-size: 11px; display: grid; justify-items: center; gap: 2px; }
.model.on { border-color: var(--ink); background: #EAF1F8; color: var(--ink); }
.model svg { width: 34px; height: 34px; }
input[type=range] { width: 100%; accent-color: var(--ink); }
.vessels { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.vessel { flex: none; width: 74px; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 6px 4px; font-size: 11px; text-align: center; }
.vessel img { width: 52px; height: 52px; object-fit: contain; }
.vessel.on { border-color: var(--ink); background: #EAF1F8; }
.vessel .ph { width: 52px; height: 52px; margin: 0 auto; border-radius: 50%; border: 1.5px dashed var(--muted); display: grid; place-items: center; color: var(--muted); font-size: 18px; }
.step { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; }
.stepper button { border: 0; background: none; width: 30px; height: 30px; font-size: 16px; }
.stepper b { min-width: 46px; text-align: center; font-family: "Noto Serif TC", serif; }
.list { display: grid; gap: 6px; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: #fff; text-align: left; width: 100%; }
.item .grow { flex: 1; min-width: 0; }
.item .sub { color: var(--muted); font-size: 12px; }
.item img.qt { width: 26px; height: 26px; }
.pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.live { background: #EAF1F8; color: var(--ink); border-color: #C8D9EA; }
.pill.staff { background: #FBF6EA; color: #8A6A2B; border-color: #EBDDBC; }
.pill.lm { background: #EAF1F8; color: var(--ink); border-color: #C8D9EA; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.stats div { background: var(--paper); border-radius: 10px; padding: 6px 2px; }
.stats b { display: block; font: 700 16px "Noto Serif TC", serif; }
.stats span { font-size: 11px; color: var(--muted); }
.funnel { display: grid; gap: 5px; }
.funnel .bar { display: grid; grid-template-columns: 90px 1fr 34px; align-items: center; gap: 8px; font-size: 12px; }
.funnel .track { height: 10px; background: var(--paper); border-radius: 6px; overflow: hidden; }
.funnel .track i { display: block; height: 100%; background: var(--ink); border-radius: 6px; }
.funnel .bar.drop .track i { background: var(--wax); }
.wizard { display: flex; gap: 4px; margin: 6px 0 12px; }
.wizard button { flex: 1; border: 0; background: var(--paper); border-radius: 8px; padding: 6px 0; font-size: 12px; color: var(--muted); }
.wizard button.on { background: var(--ink); color: #fff; }
.wizard button.done { color: var(--ink); }
.status { display: flex; align-items: center; gap: 8px; background: var(--paper); border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; font-size: 13px; }
.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 10px; }

/* markers */
.mk { cursor: pointer; }
.gem { width: 64px; height: 64px; margin-bottom: -10px; object-fit: contain; display: block; filter: drop-shadow(0 2px 2px rgba(22,38,63,.25)); }
.gem.hid { opacity: .35; filter: grayscale(1); }
.mk.sel .gem, .mk.sel .seal { outline: 3px solid rgba(47,93,138,.35); outline-offset: 3px; border-radius: 50%; }
.draft .gem { animation: bob 1s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-4px); } }
.seal { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; box-shadow: 0 0 0 3px #fff, 0 3px 6px rgba(22,38,63,.3); }
.seal svg { width: 16px; height: 16px; }
.spot { width: 14px; height: 14px; border-radius: 50%; border: 2px dashed var(--plum); background: rgba(110,43,63,.12); }
.qpin { position: relative; width: 34px; height: 42px; }
.qpin img.p { width: 34px; height: 42px; display: block; }
.qpin img.t { position: absolute; left: 6px; top: 5px; width: 22px; height: 22px; border-radius: 50%; }
.qpin b { position: absolute; right: -6px; top: -4px; background: var(--navy); color: #fff; font: 700 11px "Noto Serif TC", serif; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }
.bank { opacity: .55; }
.bank .qpin { transform: scale(.8); }
.keeper { width: 40px; height: 52px; object-fit: contain; filter: drop-shadow(0 2px 2px rgba(22,38,63,.25)); }
.maplibregl-marker:has(.handle) { z-index: 5; }
.handle { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); box-shadow: 0 2px 4px rgba(22,38,63,.3); cursor: grab; }
.citylabel { font: 700 12px "Noto Serif TC", serif; color: var(--ink); background: rgba(246,248,251,.9); padding: 2px 8px; border-radius: 999px; border: 1px dashed var(--ink); pointer-events: none; }
.demo { font-size: 11px; color: var(--muted); }
</style>
</head>

    <p class="note">${o.vessel === "default" ? t("byCodex") + " · " : ""}${t("dupStar")}</p>
    <label class="f">${t("stamp")}</label>
    <div class="vessels"><button class="vessel ${o.stamp === "default" ? "on" : ""}" data-act="stamp" data-v="default"><div class="ph">✦</div>${t("defaultStamp")}</button>
    ${o.stamp && o.stamp !== "default" ? `<button class="vessel on"><img src="${ART}stamps/stamp-${o.stamp}.webp">${nm(o)}</button>` : ""}</div></div>
  <div class="sec"><h3><span class="num">4</span>${t("lmSections")[3]}</h3>
    <div class="step"><span>${t("hp")}</span>${stepper("hp", o.hp, 5)}</div>
    <div class="step" style="margin-top:8px"><span>${t("time")}</span>${stepper("time", o.time, 10, " " + t("sec"))}</div></div>`;
}
function render() {
  document.documentElement.lang = S.lang === "zh" ? "zh-Hant" : "en";
  document.getElementById("brand").textContent = t("brand");
  document.getElementById("city").textContent = t("city");
  document.getElementById("lang").textContent = t("lang");
  document.getElementById("modes").innerHTML = ["build", "hunts"].map((m) => `<button class="${S.mode === m ? "on" : ""}" data-mode="${m}">${t(m)}</button>`).join("");
  // toolbar
  const tools = document.getElementById("tools");
  if (S.mode === "build") tools.innerHTML = [["waypost", "addWaypost"], ["landmark", "addLandmark"], ["spot", "addSpot"]].map(([k, l]) => `<button class="tool ${S.tool === k ? "on" : ""}" data-act="tool" data-v="${k}"><span class="plus">＋</span>${t(l)}</button>`).join("")
    + `<button class="tool ${S.grid ? "on" : ""}" data-act="grid">▦ ${t("grid")}</button>`;
  else tools.innerHTML = S.hunt && S.hunt.status !== "live" && S.step === 4 ? [["arrive", "addArrive"], ["catch", "addCatch"]].map(([k, l]) => `<button class="tool ${S.tool === k ? "on" : ""}" data-act="tool" data-v="${k}">${t(l)}</button>`).join("") : "";
  // hint
  const hint = document.getElementById("hint");
  const hints = { waypost: "hintWaypost", landmark: "hintLandmark", spot: "hintSpot", move: "hintMove", buildings: "hintBuildings", seal: "hintSeal", arrive: "hintWaypost", catch: "hintWaypost" };
  const hk = S.tool && hints[S.tool];
  hint.hidden = !hk;
  if (hk) hint.innerHTML = `${S.mode === "hunts" ? (S.lang === "zh" ? "點地圖放任務" : "Tap the map to place the quest") : t(hk)}<button data-act="canceltool">${t("cancel")}</button>`;
  updateGps();
  pi.innerHTML = S.mode === "build" ? buildPanel() : huntPanel();
  panel.classList.toggle("small", !S.sheetBig);
}
function buildPanel() {
  if (S.draft) {
    const d = S.draft;
    if (d.kind === "waypost") return `<h2>${t("newWaypost")}</h2><p class="note demo">${t("demoNote")}</p>
      <div class="sec">${namesBlock(d)}</div>
      <div class="sec"><h3>${t("picture")}</h3>${sceneGrid(d)}${d.photo ? `<label class="f">${t("credit")}</label><input type="text" placeholder="© …">` : ""}</div>
      <div class="sec">${softNotes(d)}</div>
      <div class="actions"><button class="btn pri" data-act="save" ${d.zh || d.en ? "" : "disabled"}>${t("save")}</button><button class="btn" data-act="tool" data-v="move">${t("move")}</button><button class="btn" data-act="fieldmove">${t("moveHere")}</button><button class="btn" data-act="discard">${t("cancel")}</button></div>`;
    return `<h2>${d.fromWaypost ? t("makeLandmark") : (S.lang === "zh" ? "新地標" : "New Landmark")}</h2><p class="note demo">${t("demoNote")}</p>${landmarkBody(d, true)}
      <div class="sec">${softNotes(d)}</div>
      <div class="actions"><button class="btn pri" data-act="save" ${d.zh || d.en ? "" : "disabled"}>${t("save")}</button><button class="btn" data-act="discard">${t("cancel")}</button></div>`;
  }
  const o = find();
  if (o && S.sel.kind === "waypost") {
    const lvl = o.spins >= 300 ? 3 : o.spins >= 100 ? 2 : 1;
    return `<h2>${esc(nm(o))} ${o.hidden ? `<span class="pill">${t("hide")}</span>` : ""}</h2><p class="note">${t("waypost")}</p>
      <div class="stats"><div><b>${o.spins}</b><span>${t("spins")}</span></div><div><b>${lvl}</b><span>${t("level")}</span></div><div><b>${o.spins ? t("minsAgo", 7 + (o.spins % 50)) : t("never")}</b><span>${t("lastSpin")}</span></div><div><b>${o.spins % 5}</b><span>${t("rack")}</span></div></div>
      <div class="sec">${namesBlock(o)}</div>
      <div class="sec"><h3>${t("picture")}</h3>${sceneGrid(o)}</div>
      <div class="sec">${softNotes(o, o.id)}</div>
      <div class="actions"><button class="btn pri" data-act="savesel">${t("save")}</button><button class="btn" data-act="tool" data-v="move">${t("move")}</button><button class="btn" data-act="fieldmove">${t("moveHere")}</button></div>
      <div class="actions"><button class="btn" data-act="makelm">${t("makeLandmark")}</button><button class="btn red" data-act="hide">${o.hidden ? t("show") : t("hide")}</button></div>`;
  }
  if (o && S.sel.kind === "landmark") return `<h2>${esc(nm(o))} <span class="pill lm">${t("landmark")}</span></h2>${landmarkBody(o, false)}
      <div class="actions"><button class="btn pri" data-act="savesel">${t("save")}</button><button class="btn" data-act="tool" data-v="move">${t("move")}</button><button class="btn" data-act="fieldmove">${t("moveHere")}</button></div>`;
  const used = new Set([...S.wayposts.filter((w) => !w.hidden), ...S.landmarks].map(cellKey)).size;
  return `<h2>${t("overview")}</h2><p class="note">${t("overviewNote")}</p>
    <div class="stats"><div><b>${S.wayposts.filter((w) => !w.hidden).length}</b><span>${t("cityStats")[0]}</span></div><div><b>${S.landmarks.length}</b><span>${t("cityStats")[1]}</span></div><div><b>${S.spots.length}</b><span>${t("cityStats")[2]}</span></div><div><b>${used}</b><span>${t("cityStats")[3]}</span></div></div>
    <p class="note" style="margin-top:12px">${t("cellsNote")}</p><p class="note demo">${t("demoNote")}</p>`;
}
function huntPanel() {
  const h = S.hunt;
  if (!h) return `<h2>${t("huntsTitle")}</h2><div class="list" style="margin-top:10px">
      ${S.hunts.map((x) => `<button class="item" data-act="openhunt" data-id="${x.id}"><img class="qt" src="${ART}stamps/stamp-hunt-xinyi-2026-11.webp" style="width:36px;height:36px" onerror="this.style.visibility='hidden'"><span class="grow"><b>${esc(nm(x))}</b><div class="sub">${x.quests.length} ${S.lang === "zh" ? "個任務" : "quests"} · ${x.radius} ${t("m")}</div></span><span class="pill ${x.status === "live" ? "live" : x.status === "staff" ? "staff" : ""}">${t(x.status)}</span></button>`).join("")}
      <button class="item" data-act="newhunt"><span class="num">＋</span><span class="grow"><b>${t("newHunt")}</b></span></button></div><p class="note demo" style="margin-top:12px">${t("demoNote")}</p>`;
  const back = `<button class="btn" data-act="closehunt">← ${t("huntsTitle")}</button>`;
  const lm = S.landmarks.find((l) => l.id === h.landmark);
  const ctr = { lng: h.center[0], lat: h.center[1] };
  const wIn = S.wayposts.filter((w) => !w.hidden && dist(w, ctr) <= h.radius).length, sIn = S.spots.filter((s) => dist(s, ctr) <= h.radius).length;
  const qList = `<div class="list">${h.quests.length ? h.quests.map((q, i) => `<div class="item"><img class="qt" src="${ART}quest-types/quest-type-${q.type}.webp"><span class="grow"><b>${i + 1}. ${t("qTypes")[q.type]}${q.type === "catch" ? " · " + t("catchN", q.count) : ""}</b><div class="sub">${esc(nm(q)) || "—"}</div></span>${h.status !== "live" && q.type !== "landmark" ? `${q.type === "catch" ? stepper("count:" + q.id, q.count, 1) : ""}<button class="btn" data-act="rmq" data-id="${q.id}" aria-label="×">×</button>` : ""}</div>`).join("") : `<div class="empty">—</div>`}</div>`;
  if (h.status === "live") return `${back}<h2 style="margin-top:12px">${esc(nm(h))} <span class="pill live">${t("live")}</span></h2><p class="note">${t("liveNote")}</p>
    <div class="sec"><h3>${t("funnelTitle")}</h3><div class="funnel">${h.funnel.map(([k, v], i) => `<div class="bar ${i && h.funnel[i - 1][1] - v >= 8 ? "drop" : ""}"><span>${t("funnel")[k]}</span><span class="track"><i style="width:${h.funnel[0][1] ? v / h.funnel[0][1] * 100 : 0}%"></i></span><b>${v}</b></div>`).join("")}</div><p class="note" style="margin-top:8px">${h.funnel[0][1] ? t("funnelNote") : t("noPlayers")}</p></div>
    <div class="sec"><h3>${t("steps")[2]}</h3><p class="note">${esc(t("keeperLine", nm(h.keeper)))}</p></div>
    <div class="sec"><h3>${t("steps")[3]}</h3>${qList}</div>
    <div class="sec"><p class="note">${t("inside", wIn, sIn)} · ${t("limit")} ${h.limit} · +${h.xp} ${t("xp")} · ${h.gold} ${t("gold")}</p></div>`;
  const live = S.hunts.find((x) => x.status === "live" && x !== h);
  const ready = h.keeper && h.quests.some((q) => q.type !== "landmark") && h.landmark;
  const status = `<div class="status"><span class="pill ${h.status === "staff" ? "staff" : ""}">${t(h.status)}</span><span>${t(h.status === "staff" ? "staffNote" : "draftNote")}</span></div>`;
  let body = "";
  if (S.step === 1) body = lm ? `<div class="item"><span class="seal" style="width:26px;height:26px">${sealSvg}</span><span class="grow"><b>${esc(nm(lm))}</b></span></div>` : `<div class="empty">${t("stepNote")[0]}</div>`;
  if (S.step === 2) body = `<div class="step"><span>${t("radius")}</span><b class="serif">${h.radius} ${t("m")}</b></div><p class="note" style="margin-top:8px">${t("inside", wIn, sIn)}</p>`;
  if (S.step === 3) body = h.keeper ? `<div class="item"><img class="qt" src="${ART}characters/keeper.webp" style="width:30px;height:38px;object-fit:contain"><span class="grow"><b>${esc(t("keeperLine", nm(h.keeper) || "…"))}</b></span></div><label class="f">${t("nameZh")}</label><input type="text" data-bind="keeper.zh" value="${esc(h.keeper.zh)}"><label class="f">${t("nameEn")}</label><input type="text" data-bind="keeper.en" value="${esc(h.keeper.en)}">` : `<div class="empty">${t("stepNote")[2]}</div>`;
  if (S.step === 4) body = `<div class="row" style="margin-bottom:8px"><button class="btn ${S.tool === "arrive" ? "pri" : ""}" data-act="tool" data-v="arrive">${t("addArrive")}</button><button class="btn ${S.tool === "catch" ? "pri" : ""}" data-act="tool" data-v="catch">${t("addCatch")}</button></div><p class="note">${t("fromBank")}</p>${qList}`;
  if (S.step === 5) body = `<label class="f">${t("huntName")} (中文)</label><input type="text" data-bind="hunt.zh" value="${esc(h.zh)}"><label class="f">${t("huntName")} (English)</label><input type="text" data-bind="hunt.en" value="${esc(h.en)}">
      <div class="step" style="margin-top:10px"><span>${t("limit")}</span>${stepper("limit", h.limit, 5)}</div>
      <div class="step" style="margin-top:8px"><span>${t("xp")}</span>${stepper("xp", h.xp, 50)}</div>
      <div class="step" style="margin-top:8px"><span>${t("gold")}</span>${stepper("gold", h.gold, 1)}</div>
      <div class="step" style="margin-top:8px"><span>${t("repeat")}</span>${stepper("repeat", h.repeat, 10)}</div>
      <label class="f">${t("openDate")}</label><input type="date" value="${h.open}">
      <label class="f">${t("stamp")}</label><div class="vessels"><button class="vessel on"><div class="ph">✦</div>${t("defaultStamp")}</button></div>`;
  return `${back}<h2 style="margin-top:12px">${esc(nm(h)) || t("newHunt")}</h2>${status}
    <div class="wizard">${t("steps").map((s, i) => `<button class="${S.step === i + 1 ? "on" : ""} ${S.step > i + 1 ? "done" : ""}" data-act="gostep" data-v="${i + 1}">${i + 1} ${s}</button>`).join("")}</div>
    <p class="note">${t("stepNote")[S.step - 1]}</p>${body}
    <div class="actions">${S.step > 1 ? `<button class="btn" data-act="gostep" data-v="${S.step - 1}">${t("back")}</button>` : ""}${S.step < 5 ? `<button class="btn pri" data-act="gostep" data-v="${S.step + 1}" ${S.step === 1 && !lm ? "disabled" : ""}>${t("next")}</button>` : ""}</div>
    <div class="sec" style="margin-top:14px">${ready ? "" : `<p class="note">${t("needKeeper")}</p>`}
      <div class="actions">${h.status === "draft" ? `<button class="btn pri" data-act="staff" ${ready ? "" : "disabled"}>${t("makeStaff")}</button>` : ""}
      ${h.status === "staff" ? (live ? `<p class="note" style="width:100%;margin:0">${t("oneOpen")}</p><button class="btn pri" data-act="publish">${t("endAndPublish")}</button>` : `<button class="btn pri" data-act="publish">${t("publish")}</button>`) : ""}</div></div>`;
}

/* ===================== Events ===================== */
document.getElementById("lang").onclick = () => { S.lang = S.lang === "zh" ? "en" : "zh"; drawAll(); render(); };
document.getElementById("grab").onclick = () => { S.sheetBig = !S.sheetBig; render(); };
document.getElementById("modes").onclick = (e) => { const m = e.target.closest("[data-mode]")?.dataset.mode; if (!m) return; S.mode = m; S.tool = null; S.sel = null; S.draft = null; S.hunt = null; if (m === "hunts") map.easeTo({ center: [121.5635, 25.0372], zoom: 14.6 }); drawAll(); render(); };
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "INPUT") return;
  const a = b.dataset.act, v = b.dataset.v, cur = S.draft || find(), h = S.hunt;
  if (a === "tool") { if (["buildings", "move", "seal", "arrive", "catch"].includes(v)) { S.tool = S.tool === v ? null : v; } else { S.sel = null; S.draft = null; setTool(v); drawAll(); return; } render(); return; }
  if (a === "canceltool") { S.tool = null; render(); return; }
  if (a === "grid") { S.grid = !S.grid; if (!S.grid) map.getSource("grid").setData(fc([])); else { if (map.getZoom() < 16) map.easeTo({ zoom: 16.4 }); drawGrid(); } render(); return; }
  if (a === "scene" && cur) { cur.scene = v; cur.photo = null; render(); return; }
  if (a === "pickname" && cur) { const n = cur.names[+b.dataset.i]; cur.zh = n.zh; cur.en = n.en; if (cur.kind === "waypost") cur.scene = sceneFor(n.kind); render(); return; }
  if (a === "save") return saveDraft();
  if (a === "discard") { S.draft = null; S.tool = null; drawAll(); render(); return; }
  if (a === "savesel") { toast(t("saved")); S.sel = null; S.lookTab = null; S.tool = null; drawAll(); render(); return; }
  if (a === "fieldmove") return fieldMove();
  if (a === "hide" && cur) { cur.hidden = !cur.hidden; drawAll(); render(); toast(cur.hidden ? t("hiddenToast") : t("saved")); return; }
  if (a === "makelm" && cur) { const w = cur; S.sel = null; newDraft("landmark", w); Object.assign(S.draft, { zh: w.zh, en: w.en, fromWaypost: w.id }); render(); return; }
  if (a === "look" && cur) { S.lookTab = v; if (S.draft) { const d = S.draft; d.look = v; if (v === "model" && !d.model) d.model = "tower"; if (v === "buildings" && !d.modelPicked) d.model = null; if (v === "seal") { d.model = null; d.tiles = []; } } if (v === "buildings") S.tool = "buildings"; else if (S.tool === "buildings") S.tool = null; drawAll(); render(); return; }
  if (a === "model" && cur) { cur.model = v; cur.modelPicked = true; drawAll(); render(); return; }
  if (a === "size" && cur) { cur.size = v; drawAll(); render(); return; }
  if (a === "color" && cur) { cur[b.dataset.f] = v; drawAll(); render(); return; }
  if (a === "cleartiles" && cur) { cur.tiles = []; cur.realTop = 0; drawAll(); render(); return; }
  if (a === "vessel" && cur) { cur.vessel = v; render(); return; }
  if (a === "stamp" && cur) { cur.stamp = v; render(); return; }
  if (a === "step") { const f = b.dataset.f, d = +b.dataset.d;
    if (f.startsWith("count:")) { const q = h.quests.find((x) => x.id === f.slice(6)); q.count = Math.min(5, Math.max(1, q.count + d)); }
    else if (S.mode === "hunts") h[f] = Math.max(0, h[f] + d); else cur[f] = Math.max(f === "hp" ? 5 : 10, cur[f] + d);
    render(); return; }
  if (a === "openhunt") { S.hunt = S.hunts.find((x) => x.id === b.dataset.id); S.step = S.hunt.status === "live" ? 0 : 4; map.easeTo({ center: S.hunt.center, zoom: 14.6 }); drawAll(); render(); return; }
  if (a === "newhunt") { S.hunt = { id: nid("h"), zh: "", en: "", status: "draft", landmark: null, center: [121.5635, 25.0372], radius: 1000, keeper: null, quests: [], limit: 60, xp: 300, gold: 5, repeat: 50, open: "2026-12-01" }; S.hunts.push(S.hunt); S.step = 1; drawAll(); render(); return; }
  if (a === "closehunt") { S.hunt = null; S.tool = null; drawAll(); render(); return; }
  if (a === "gostep") { S.step = +v; S.tool = null; if (S.step === 2 && h) map.easeTo({ center: h.center, zoom: 14.4 }); drawAll(); render(); return; }
  if (a === "rmq") { h.quests = h.quests.filter((q) => q.id !== b.dataset.id); drawAll(); render(); return; }
  if (a === "staff") { h.status = "staff"; render(); toast(t("staffNote")); return; }
  if (a === "publish") { S.hunts.forEach((x) => { if (x.status === "live" && x !== h) x.status = "ended"; }); h.status = "live"; h.funnel = [["joined", 0], ["checkedIn", 0], ["finished", 0]]; S.step = 0; drawAll(); render(); toast(t("live") + " ✓"); return; }
});
document.addEventListener("input", (e) => {
  const el = e.target, cur = S.draft || find();
  if (el.dataset.bind) { const [o, k] = el.dataset.bind.includes(".") ? el.dataset.bind.split(".") : [null, el.dataset.bind];
    if (o === "keeper") S.hunt.keeper[k] = el.value; else if (o === "hunt") { S.hunt[k] = el.value; S.hunt.nameEdited = true; } else if (cur) cur[k] = el.value;
    const save = pi.querySelector('[data-act="save"]'); if (save && S.draft) save.disabled = !(S.draft.zh || S.draft.en); return; }
  if (el.dataset.act === "range" && cur) { cur[el.dataset.f] = +el.value; el.previousElementSibling.textContent = el.previousElementSibling.textContent.replace(/· .*/, "· " + el.value + (el.dataset.f === "rot" ? "°" : " m")); drawAll(); }
});
document.addEventListener("change", (e) => {
  const el = e.target, cur = S.draft || find();
  if (el.dataset.act === "photo" && el.files[0] && cur) { const r = new FileReader(); r.onload = () => { cur.photo = r.result; render(); }; r.readAsDataURL(el.files[0]); }
  if (el.type === "date" && S.hunt) S.hunt.open = el.value;
});
render();
</script>
</body>
</html>
